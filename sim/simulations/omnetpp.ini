# kvrsu simulation configuration.
#
# Do not start this file by hand: hpc/run_one.sh supplies the per-run values
# (scenario, RSU position, server port, seed, output paths) on the command line.
# Workload and radio parameters are set here; every value marked [workload] is
# part of the experiment definition in docs/EXPERIMENTS.md.

[General]
network = kvrsu.KvScenario
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
cmdenv-autoflush = true
debug-on-errors = false
print-undisposed = false
sim-time-limit = 150s
# Two random streams: 0 for the network (MAC backoff, fading), 1 for the applications.
# With the same seed every policy therefore sees exactly the same vehicles and tasks.
num-rngs = 2
*.node[*].appl.rng-0 = 1
*.rsu[*].appl.rng-0 = 1
**.scalar-recording = true
**.vector-recording = false

*.playgroundSizeX = 1100m
*.playgroundSizeY = 1100m
*.playgroundSizeZ = 50m
*.annotations.draw = false

# ---- SUMO coupling (SUMO is forked by the simulation; a free port is chosen) ----
*.manager.updateInterval = 0.1s
*.manager.autoShutdown = true
*.manager.moduleType = "org.car2x.veins.nodes.Car"
*.manager.moduleName = "node"
*.manager.command = "sumo"
*.manager.configFile = "scenarios/default/sim.sumo.cfg"

# ---- IEEE 802.11p radio (values of the Veins reference configuration) ----
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 1600m
*.connectionManager.drawMaxIntfDist = false
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 100mW          # 20 dBm, so one RSU covers the 1 km^2 grid
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.useAcks = true            # unicast frames are acknowledged and retried
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

# ---- RSU ----
*.rsu[0].mobility.x = 525
*.rsu[0].mobility.y = 525
*.rsu[0].mobility.z = 5
*.rsu[*].applType = "kvrsu.RsuApp"
*.rsu[*].appl.window = 0.1s                  # [workload] decision window
*.rsu[*].appl.cpuHz = 2e10                   # [workload] edge-server CPU
*.rsu[*].appl.rsuBeaconInterval = 0.5s
*.rsu[*].appl.serverPort = 5555
*.rsu[*].appl.logPrefix = "results/run"

# ---- vehicles ----
*.node[*].applType = "kvrsu.VehicleApp"
*.node[*].appl.warmup = 30s
*.node[*].appl.taskRate = 0.2                # [workload] tasks/s per vehicle
*.node[*].appl.taskCycles = uniform(1e8, 8e8)          # [workload]
*.node[*].appl.taskBytes = intuniform(2000, 8000)      # [workload]
*.node[*].appl.taskDeadline = uniform(0.5s, 1.5s)      # [workload]
*.node[*].appl.cpuHz = uniform(0.5e9, 2e9)             # [workload]
*.node[*].appl.stateInterval = 0.5s                    # [workload]
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

# ---- common application settings ----
*.**.appl.headerLength = 80 bit
*.**.appl.dataLengthBits = 0 bit             # payload sizes are set per message type
*.**.appl.sendBeacons = false                # the applications send their own state messages
*.**.appl.dataOnSch = false
*.**.appl.dataUserPriority = 5

[Config Base]
